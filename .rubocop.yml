AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false

Style/LambdaCall:
  Enabled: false

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "spec/**/*"

Naming/VariableNumber:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "spec/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false
